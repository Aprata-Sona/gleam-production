<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gleam Production — Swiss Style Portfolio</title>
<style>
:root{--bg:#f4f4f2;--fg:#111;--mute:#8a8a86;--line:#d9d9d5;--card:#e6e6e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0d;--fg:#f1f1ee;--mute:#777772;--line:#2a2a28;--card:#1a1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0d;--fg:#f1f1ee;--mute:#777772;--line:#2a2a28;--card:#1a1a18;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:var(--bg)}
.logo{font-weight:600;font-size:18px}
nav{display:flex;gap:24px}
nav a{color:var(--mute);transition:color .2s}
nav a:hover,nav a.on{color:var(--fg)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute);font-size:13px}
.toggle button{background:none;border:0;font:inherit;color:var(--mute);cursor:pointer;padding:2px 0;margin-left:16px}
.toggle button.on{color:var(--fg);border-bottom:1px solid var(--fg)}
.hero{padding:12vh 24px 8vh;font-size:clamp(40px,9vw,128px);line-height:.95;letter-spacing:-.045em;font-weight:500;max-width:14ch}
.hero small{display:block;margin-top:32px;font-size:13px;letter-spacing:0;color:var(--mute);font-weight:400}
/* list view */
.list .row{display:grid;grid-template-columns:60px 1fr 1fr 80px;gap:16px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);transition:padding .3s,opacity .3s}
.list:hover .row{opacity:.35}
.list .row:hover{opacity:1;padding-left:40px}
.row .n,.row .c,.row .y{color:var(--mute);font-size:13px}
.row .t{font-size:22px;letter-spacing:-.03em}
.row .y{text-align:right}
.grid{display:none}
.grid-on .list{display:none}
.grid-on .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:8px 24px 48px}
.card .img{aspect-ratio:4/5;background:var(--card);overflow:hidden}
.card .img i{display:block;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .img i{transform:scale(1.06)}
.card p{display:flex;justify-content:space-between;padding:8px 0 16px;font-size:13px}
.card p span:last-child{color:var(--mute)}
/* intro + rolling hero */
body.lock{overflow:hidden}
#intro{position:fixed;inset:0;z-index:100;background:var(--fg);color:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;padding:24px;transition:transform 1s cubic-bezier(.76,0,.24,1)}
#intro.out{transform:translateY(-100%)}
#intro .il{position:absolute;left:24px;top:calc(18px + env(safe-area-inset-top,0px));font-size:18px;font-weight:600}
#intro .ic{font-size:clamp(72px,18vw,240px);line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-left:auto}
.roll{position:relative;height:100vh;height:100svh;overflow:hidden}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 24px;opacity:0;transform:translateY(10vh);transition:opacity 1.2s,transform 1.6s cubic-bezier(.2,.7,.2,1)}
body.ready .cols{opacity:1;transform:none}
.col{display:flex;flex-direction:column;gap:8px;padding-bottom:8px;will-change:transform}
.col i{display:block;aspect-ratio:4/5;flex:none}
.roll .hero{position:absolute;left:0;bottom:0;padding:24px 24px 40px;max-width:none;color:#fff;mix-blend-mode:difference;font-size:clamp(40px,8vw,120px);pointer-events:none}
.roll .hero small{color:inherit;font-size:13px}
body:not(.ready) *{animation-play-state:paused!important}
@media(max-width:700px){.cols{grid-template-columns:repeat(3,1fr)}.col:nth-child(n+4){display:none}}
/* animation */
@keyframes rise{to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
header{animation:drop .8s cubic-bezier(.2,.7,.2,1) both}
.bar{animation:fade 1s .6s both}
.hero small{opacity:0;animation:fade 1s 1s forwards}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.w span{display:inline-block;transform:translateY(110%);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s,transform .9s cubic-bezier(.2,.7,.2,1),padding .3s}
.rv.in{opacity:1;transform:none}
.card .img i{transform:scale(1.15)}
.card.in .img i{transform:scale(1)}
.card.in:hover .img i{transform:scale(1.06)}
nav a{position:relative}
nav a::after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:right;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
nav a:hover::after,nav a.on::after{transform:scaleX(1);transform-origin:left}
#pv{left:0;top:0;will-change:translate}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.w span,.hero small{opacity:1!important;transform:none!important}}
/* hover preview */
#pv{position:fixed;width:220px;aspect-ratio:4/5;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;z-index:5}
#pv.show{opacity:1;transform:scale(1)}
footer{padding:64px 24px calc(32px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
footer a{color:var(--fg)}
@media(max-width:700px){nav{gap:14px}.list .row{grid-template-columns:36px 1fr 60px}.row .c{display:none}.row .t{font-size:18px}#pv{display:none}}
@media(hover:none){.list:hover .row{opacity:1}}
/* screenshot match: glass pills, serif tiles, staggered 2-col */
:root{--g:12px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media(max-width:700px){:root{--g:3.9vw}}
header{position:fixed;z-index:40;left:0;right:0;margin:0 auto;width:min(calc(100% - 48px),620px);top:calc(14px + env(safe-area-inset-top,0px));padding:16px 28px;border-radius:999px;color:#fff;background:rgba(34,22,26,.42);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);font-family:var(--mono);font-size:14px}
header .logo{font-weight:400;font-size:15px}
header nav a{color:rgba(255,255,255,.7)}
header nav a:hover,header nav a.on{color:#fff}
header nav a::after{background:#fff}
#mb{display:none;background:none;border:0;width:28px;height:20px;position:relative;cursor:pointer}
#mb i{position:absolute;left:4px;right:4px;height:2px;background:#fff;border-radius:2px;transition:transform .3s,top .3s}
#mb i:first-child{top:5px}#mb i:last-child{top:12px}
header.open #mb i:first-child{top:8px;transform:rotate(45deg)}
header.open #mb i:last-child{top:8px;transform:rotate(-45deg)}
.bar{position:relative;z-index:30}
.toggle{position:fixed;z-index:20;left:0;right:0;margin:0 auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(34,22,26,.5);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);font-family:var(--mono);font-size:13px}
.toggle button{margin:0;padding:10px 18px;border:0;border-radius:999px;color:rgba(255,255,255,.65)}
.toggle button.on{background:rgba(255,255,255,.2);color:#fff;border:0}
.cols{gap:var(--g);padding:0 var(--g)}
.col{gap:var(--g);padding-bottom:var(--g)}
.col i{aspect-ratio:3/4;border-radius:10px;display:grid;place-items:center;text-align:center;font-style:normal;color:#fff;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:clamp(26px,8.5vw,52px);letter-spacing:-.02em;text-shadow:0 1px 24px rgba(0,0,0,.25)}
.roll .hero{font-size:0;padding:24px;max-width:none}
.grid-on .grid{grid-template-columns:repeat(2,1fr);gap:var(--g);padding:var(--g) var(--g) 110px}
.card:nth-child(even){translate:0 40px}
.card .img{border-radius:10px}
@media(min-width:900px){.grid-on .grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){#mb{display:block}.cols{grid-template-columns:repeat(2,1fr)}.col:nth-child(n+3){display:none}header nav{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;flex-direction:column;gap:16px;padding:22px 28px;border-radius:28px;background:rgba(34,22,26,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}header.open nav{display:flex}}
</style>
</head>
<body class="lock">
<div id="intro"><span class="il">Gleam Production</span><span class="ic" id="ic">0</span></div>
<header>
  <a class="logo" href="#projects">Gleam Production</a><button id="mb" aria-label="Menu"><i></i><i></i></button>
  <nav><a class="on" href="#projects">Projects</a><a href="#studio">Studio</a><a href="#journal">Journal</a><a href="#contact">Contact</a></nav>
</header>

<section class="roll"><div class="cols" id="cols"></div><h1 class="hero">Selected work, quietly made.<small>Scroll Down ↓</small></h1></section>

<div class="bar" id="projects">
  <span id="count">10 Projects</span>
  <div class="toggle"><button id="bl" class="on">List View</button><button id="bg">Grid View</button></div>
</div>

<main id="wrap">
  <section class="list" id="list"></section>
  <section class="grid" id="grid"></section>
</main>

<div id="pv"></div>

<footer id="contact">
  <span>© 2026 Gleam Production</span>
  <a href="mailto:hello@example.com">hello@example.com</a>
  <span>Instagram · Behance · LinkedIn</span>
</footer>

<script>
const data=[
["Soft Stories","Editorial",2026,"#c98a7a,#1a1210"],
["Silver Matter","Photography",2026,"#c9ccd0,#6b7078"],
["Amber Glace","Creative Direction",2025,"#e0a43a,#3a2208"],
["White Bloom","Campaign",2025,"#f1d9cf,#b98a78"],
["Desert Pulse","Advertising",2025,"#e8603a,#4a1d3a"],
["Bold Flowers","Design",2024,"#f4f1ea,#a9b5a0"],
["River Touch","Art Direction",2024,"#2fd0c4,#0c1f26"],
["Surface Drift","Photography",2024,"#2a2a2a,#d8d8d8"],
["Bubble Realm","Campaign",2023,"#e8c93a,#111"],
["Stone Forms","Product Design",2023,"#1d1d1d,#b9bcc2"]
];
const $=id=>document.getElementById(id), grad=g=>`linear-gradient(160deg,${g.split(",")[0]},${g.split(",")[1]})`;
$("list").innerHTML=data.map((d,i)=>`<a class="row" href="#p${i}" data-g="${d[3]}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${d[0]}</span><span class="c">${d[1]}</span><span class="y">${d[2]}</span></a>`).join("");
$("grid").innerHTML=data.map((d,i)=>`<a class="card" href="#p${i}"><div class="img"><i style="background:${grad(d[3])}"></i></div><p><span>${d[0]}</span><span>${d[1]}</span></p></a>`).join("");

const pv=$("pv");
document.querySelectorAll(".row").forEach(r=>{
  r.addEventListener("mouseenter",()=>{pv.style.background=grad(r.dataset.g);pv.classList.add("show")});
  r.addEventListener("mouseleave",()=>pv.classList.remove("show"));
});
/* smooth cursor-follow preview */
let mx=0,my=0,px=0,py=0;
addEventListener("mousemove",e=>{mx=e.clientX+24;my=e.clientY-140});
(function loop(){px+=(mx-px)*.12;py+=(my-py)*.12;pv.style.translate=px+"px "+py+"px";requestAnimationFrame(loop)})();

/* hero word-by-word reveal */
(function(){const h=document.querySelector(".hero"),t=h.firstChild,f=document.createDocumentFragment();
t.textContent.trim().split(" ").forEach((w,i)=>{const s=document.createElement("span");s.className="w";s.innerHTML='<span style="--i:'+i+'">'+w+'</span>';f.appendChild(s)});
h.replaceChild(f,t)})();

const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* intro counter + curtain */
(function(){const it=$("intro"),ic=$("ic");
const done=()=>{document.body.classList.add("ready");document.body.classList.remove("lock");setTimeout(()=>it.remove(),1200)};
if(RM){done();return}
const t0=performance.now(),D=1800;
(function s(t){const k=Math.min((t-t0)/D,1);ic.textContent=Math.round(100*(1-Math.pow(1-k,2.2)));
if(k<1)return requestAnimationFrame(s);setTimeout(()=>{it.classList.add("out");setTimeout(done,500)},250)})(t0)})();

/* rolling columns, speed reacts to scroll velocity */
const cols=[...Array(5)].map((_,c)=>{const el=document.createElement("div");el.className="col";let h="";
for(let k=0;k<2;k++)data.forEach((_,j)=>{const d=data[(j+c*2)%data.length];h+='<i style="background:'+grad(d[3])+'">'+d[0]+'</i>'});
el.innerHTML=h;$("cols").appendChild(el);return{el,p:c*260}});
let sy=scrollY,v=0;
(function roll(){const dy=scrollY-sy;sy=scrollY;v+=(Math.min(Math.abs(dy),80)*.25-v)*.1;
if(!RM&&scrollY<innerHeight*1.2)cols.forEach((o,i)=>{const h=o.el.scrollHeight/2;if(!h)return;o.p+=.5+i*.12+v;const m=o.p%h;o.el.style.transform='translate3d(0,'+(i%2?m-h:-m)+'px,0)'});
requestAnimationFrame(roll)})();

/* scroll reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);setTimeout(()=>e.target.style.transitionDelay="",1600)}}),{threshold:.1});
function arm(){document.querySelectorAll(".row,.card").forEach((el,i)=>{el.classList.remove("in");el.classList.add("rv");el.style.transitionDelay=((i%10)*70)+"ms";io.observe(el)})}
arm();

function setView(grid){
  document.body.classList.toggle("grid-on",grid);arm();
  $("bg").classList.toggle("on",grid);$("bl").classList.toggle("on",!grid);
  try{localStorage.setItem("folio-view",grid?"grid":"list")}catch(e){}
}
$("bl").onclick=()=>setView(false);$("bg").onclick=()=>setView(true);
let sv="grid";try{sv=localStorage.getItem("folio-view")||"grid"}catch(e){}setView(sv==="grid");
const hd=document.querySelector("header");$("mb").onclick=()=>hd.classList.toggle("open");
document.querySelectorAll("nav a").forEach(a=>a.addEventListener("click",()=>hd.classList.remove("open")));
</script>
</body>
</html>
